<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — СмолЦОДД</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/errors/error_404.css') }}" rel="stylesheet">
</head>
<body>
    <div class="error-container">
        <div class="error-content">
            <i class="bi bi-map error-icon"></i>
            
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Страница не найдена</h2>
            
            <p class="error-description">
                Извините, но страница, которую вы ищете, не существует или была перемещена. 
                Возможно, она была удалена или вы ввели неправильный адрес.
            </p>

            <div class="error-actions">
                <a href="/" class="btn-error btn-primary">
                    <i class="bi bi-house"></i>На главную
                </a>
                <a href="/map" class="btn-error btn-outline">
                    <i class="bi bi-map"></i>Карта дорог
                </a>
                <button onclick="history.back()" class="btn-error btn-secondary">
                    <i class="bi bi-arrow-left"></i>Назад
                </button>
            </div>

            <div class="quick-links">
                <h3>Популярные разделы:</h3>
                <div class="links-grid">
                    <a href="/services" class="quick-link">
                        <i class="bi bi-tools"></i>
                        <span>Услуги</span>
                    </a>
                    <a href="/news" class="quick-link">
                        <i class="bi bi-newspaper"></i>
                        <span>Новости</span>
                    </a>
                    <a href="/contacts" class="quick-link">
                        <i class="bi bi-telephone"></i>
                        <span>Контакты</span>
                    </a>
                    <a href="/create_ticket" class="quick-link">
                        <i class="bi bi-megaphone"></i>
                        <span>Сообщить о проблеме</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.error-icon, .error-code, .error-title, .error-description');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    el.style.transition = 'all 0.6s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 200);
            });
        });

        function goBack() {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                history.back();
            } else {
                window.location.href = '/';
            }
        }

        document.querySelector('button[onclick="history.back()"]').onclick = goBack;
    </script>
</body>
</html>
